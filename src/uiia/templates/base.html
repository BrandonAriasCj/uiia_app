<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UIIA App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 🎨 Variables de color personalizables */
        :root {
            --color-primario: #4f46e5; 
            --color-secundario: #e0e7ff; 
            --color-texto: #1f2937;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-secundario);
            color: var(--color-texto);
        }

        nav {
            background-color: var(--color-primario);
            padding: 1rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: white;
            margin: 0 0.75rem;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .contenido {
            padding: 2rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <!-- 🔝 Navbar principal -->
    <nav>
        <div><strong>UIIA App</strong></div>
        <div>
            <a href="{% url 'landing'%}">Principal</a>
            <a href="{% url 'listado'%}">Proyectos</a>
            <a href="{% url 'crear_componente'%}">Crear</a>
        </div>
    </nav>

    <!-- 📦 Contenido dinámico -->
    <div class="contenido">
        {% block content %}
        {% endblock %}
    </div>

    <footer style="

    ">
        &copy; UIIA App - Genera tus componentes con IA
    </footer>
</body>
</html>
